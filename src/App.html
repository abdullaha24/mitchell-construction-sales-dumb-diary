<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root { --ink: #1f2933; --soft: #52606d; --line: #d9e2ec; --blue: #1f5fbf; --orange: #b45309;
              --red: #b42318; --green: #1e7d4f; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
             font-size: 16px; line-height: 1.35; color: var(--ink); background: #f5f7fa; }
      header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center;
               justify-content: space-between; gap: 8px; padding: 10px 16px; background: #fff;
               border-bottom: 1px solid var(--line); }
      header h1 { font-size: 20px; margin: 0; }
      main { padding: 12px 16px 96px; max-width: 640px; margin: 0 auto; }
      button { font: inherit; cursor: pointer; }
      .big { min-height: 48px; padding: 10px 16px; border-radius: 10px; border: 0; background: var(--blue);
             color: #fff; font-weight: 600; font-size: 17px; }
      .big.warn { background: var(--orange); }
      .big:disabled { opacity: .55; }
      .plain { min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
               background: #fff; color: var(--ink); }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
              margin-bottom: 10px; }
      .card .name { font-weight: 600; font-size: 17px; }
      .card .meta { color: var(--soft); font-size: 14px; margin-top: 2px; }
      .tag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 999px;
             background: #e6effb; color: var(--blue); margin: 6px 6px 0 0; }
      .tag.nonum { background: #fff4e5; color: var(--orange); font-weight: 600; }
      .empty, .banner { text-align: center; color: var(--soft); padding: 24px 8px; }
      .banner { background: #fff4e5; color: var(--orange); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
      label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
      .opt { font-weight: 400; color: var(--soft); }
      input[type=text], input[type=tel], input[type=date] { width: 100%; min-height: 48px; padding: 10px 12px;
             font: inherit; font-size: 17px; border: 1px solid #9aa5b1; border-radius: 10px; background: #fff; }
      .pills { display: flex; flex-wrap: wrap; gap: 8px; }
      .pill { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid #9aa5b1;
              background: #fff; color: var(--ink); font-size: 15px; }
      .pill[aria-pressed=true] { background: var(--blue); border-color: var(--blue); color: #fff; }
      .note { font-size: 14px; margin-top: 6px; color: var(--soft); }
      .note.warn { color: var(--orange); font-weight: 600; }
      .note.error { color: var(--red); font-weight: 600; }
      .actions { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 16px;
                 background: #fff; border-top: 1px solid var(--line); }
      .actions .big { flex: 1; }
      #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink);
               color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 15px; display: none; z-index: 3;
               max-width: calc(100% - 32px); text-align: center; }
      #toast.error { background: var(--red); }
      [hidden] { display: none !important; }
      .card { cursor: pointer; }
      .card .value { color: var(--ink); font-size: 14px; margin-top: 2px; font-weight: 600; }
      .tag.lost { background: #fde8e8; color: var(--red); }
      .tag.won { background: #e3f5ec; color: var(--green); }
      .site-head { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .site-head h2 { font-size: 20px; margin: 0 0 4px; }
      .site-head .line { color: var(--soft); font-size: 15px; margin-top: 2px; }
      .site-head .lastnote { margin-top: 8px; font-size: 15px; }
      .section { font-size: 18px; font-weight: 700; margin: 20px 0 0; }
      #formTitle { font-size: 20px; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <div id="data" hidden><?= data ?></div>

    <header>
      <h1 id="who"></h1>
      <button class="big" id="newSite" type="button">+ New Site</button>
    </header>

    <main id="listView">
      <div id="draftBanner" class="banner" hidden>You have a site that isn't saved yet. Tap + New Site to finish it.</div>
      <div id="noStorage" class="banner" hidden>This phone can't keep unsaved sites. Save each site before closing the app.</div>
      <div id="sites"></div>
    </main>

    <main id="siteView" hidden>
      <div class="site-head" id="siteHead"></div>
      <button class="plain" id="editDetails" type="button" style="margin-top:10px">Edit details</button>

      <div class="section">Update</div>
      <div class="label">Stage</div>
      <div class="pills" id="u-stage"></div>

      <div id="u-valueBox" hidden>
        <label for="u-value">Total Rs. value</label>
        <input id="u-value" type="text" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="e.g. 450,000">
        <div class="label">Cash or Credit</div>
        <div class="pills" id="u-terms"></div>
      </div>

      <div id="u-lostBox" hidden>
        <div class="label">Why was it lost?</div>
        <div class="pills" id="u-lost"></div>
      </div>

      <div id="u-phoneBox" hidden>
        <label for="u-phone" id="u-phoneLabel">Contact phone</label>
        <input id="u-phone" type="tel" inputmode="tel" maxlength="24" autocomplete="off" placeholder="e.g. 0300 1234567">
        <div id="u-phoneNote" class="note" hidden></div>
      </div>

      <div id="u-followBox">
        <div class="label">Next follow-up</div>
        <div class="pills" id="u-follow"></div>
        <input id="u-date" type="date" hidden style="margin-top:8px">
      </div>

      <label for="u-note">Quick note <span class="opt" id="u-noteOpt">(optional)</span></label>
      <input id="u-note" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Quoted WP-100 @ 1,450">

      <div id="u-problem" class="note error" hidden></div>
    </main>

    <main id="formView" hidden>
      <h2 id="formTitle">New site</h2>
      <label for="f-name">Site / party name</label>
      <input id="f-name" type="text" maxlength="80" autocomplete="off" placeholder="e.g. F-11 Commercial Tower">

      <div class="label">Buyer type</div>
      <div class="pills" id="f-buyer"></div>

      <label for="f-contact">Contact name <span class="opt">(optional)</span></label>
      <input id="f-contact" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Asif (site engineer)">

      <label for="f-phone">Contact phone</label>
      <input id="f-phone" type="tel" inputmode="tel" maxlength="24" autocomplete="off" placeholder="e.g. 0300 1234567">
      <div id="phoneNote" class="note" hidden></div>

      <div class="label">Products <span class="opt">(tap all that apply)</span></div>
      <div class="pills" id="f-products"></div>

      <div class="label">Area <span class="opt">(optional)</span></div>
      <div class="pills" id="f-areas"></div>
      <div id="newAreaBox" hidden>
        <input id="f-newarea" type="text" maxlength="40" autocomplete="off" placeholder="Type the area" style="margin-top:8px">
        <div class="pills" id="areaSuggest" style="margin-top:8px"></div>
      </div>

      <div id="f-followBox">
        <div class="label">Next follow-up</div>
        <div class="pills" id="f-follow"></div>
        <input id="f-date" type="date" hidden style="margin-top:8px">
      </div>

      <div id="formNote" class="note error" hidden></div>
    </main>

    <div class="actions" id="formActions" hidden>
      <button class="plain" id="cancel" type="button">Back</button>
      <button class="big" id="save" type="button">Save</button>
    </div>
    <div id="toast" role="status"></div>

    <script>
      // Everything from the server or the sheet goes on screen with textContent, never as HTML.
      var data = JSON.parse(document.getElementById('data').textContent);
      var k = data.k;
      var DRAFT_KEY = 'salesdiary.draft.' + data.rep;
      var FOLLOW = [['tomorrow', 'Tomorrow'], ['3days', '3 days'], ['1week', '1 week'], ['date', 'Pick date']];
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var SAVE_WAIT_MS = 30000;
      var screen = 'list';        // 'list' | 'form' | 'site'
      var mode = { kind: 'new' }; // the details form: { kind: 'new' } or { kind: 'edit', siteId }
      var openId = '';            // the site on the site screen
      var form = emptyForm();
      var upd = null;
      var confirmNoNumber = false;
      var busy = false;
      var phoneCheck = { valid: true };

      function $(id) { return document.getElementById(id); }
      function el(tag, text, cls) {
        var n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      }
      function rules() { return data.rules; }
      function has(list, x) { return list.indexOf(x) >= 0; }
      function siteById(id) {
        for (var i = 0; i < data.sites.length; i++) if (data.sites[i].id === id) return data.sites[i];
        return null;
      }
      // A one-time ID per form, so a save repeated after a lost reply is saved only once.
      function newSaveId() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var bytes = new Uint8Array(20);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        var id = '';
        for (var i = 0; i < bytes.length; i++) id += chars[bytes[i] % chars.length];
        return id;
      }
      function emptyForm() {
        return { name: '', buyerType: '', contactName: '', phone: '', products: [], area: '', newArea: '', addingArea: false, followUp: 'tomorrow', date: '', saveId: newSaveId() };
      }
      var storageWorks = (function () {
        try { localStorage.setItem('salesdiary.test', '1'); localStorage.removeItem('salesdiary.test'); return true; } catch (e) { return false; }
      })();
      function shortDay(key) {
        if (!key) return '';
        var p = key.split('-');
        return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1];
      }
      // How a salesman knows a number: 923001234567 → 0300 1234567 (stored form unchanged).
      function showPhone(p) {
        if (/^923\d{9}$/.test(p)) return '0' + p.slice(2, 5) + ' ' + p.slice(5);
        if (/^92\d+$/.test(p)) return '0' + p.slice(2);
        return p ? '+' + p : '';
      }
      function rs(n) { return 'Rs. ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
      function toast(text, isError) {
        var t = $('toast');
        t.textContent = text;
        t.className = isError ? 'error' : '';
        t.style.display = 'block';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(function () { t.style.display = 'none'; }, isError ? 6000 : 2500);
      }
      function addDays(key, days) {
        var p = key.split('-').map(Number);
        var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
        return d.toISOString().slice(0, 10);
      }
      function pill(text, pressed, onTap) {
        var b = el('button', text, 'pill');
        b.type = 'button';
        b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
        b.addEventListener('click', onTap);
        return b;
      }

      // ---- Drafts kept on the phone until saved (spec 003 / 004, no signal) ----
      function store(key, value) {
        try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage blocked */ }
      }
      function fetchStored(key) {
        try { var d = JSON.parse(localStorage.getItem(key) || 'null'); return d && typeof d === 'object' ? d : null; } catch (e) { return null; }
      }
      function formKey() { return mode.kind === 'edit' ? DRAFT_KEY + '.edit.' + mode.siteId : DRAFT_KEY; }
      function updKey(id) { return DRAFT_KEY + '.update.' + id; }
      function saveDraft() { store(formKey(), form); }
      function hasDraft() {
        var d = fetchStored(DRAFT_KEY);
        return !!(d && (d.name || d.contactName || d.phone || d.newArea || (d.products && d.products.length)));
      }

      // ---- Sending a save: one way for all three forms ----
      function readable(error) {
        var message = (error && error.message) || String(error || '');
        if ((typeof navigator !== 'undefined' && navigator.onLine === false) ||
            /network|connection|HTTP 0|failed to fetch|timed? ?out/i.test(message)) {
          return 'Not saved: no signal. Tap Save again.';
        }
        return message.replace(/^(Exception|Error):\s*/, '') || 'Something went wrong. Try again.';
      }
      function savedToast(r) {
        var w = r.warning || {};
        if (w.team) toast('Saved. Someone in the team already works with this contact.');
        else if (w.mine && w.mine.length) toast('Saved. You already have this number: ' + w.mine.join(', ') + '.');
        else toast('Saved');
      }
      // Calls the server; `problem` shows a message; `done` gets a good reply.
      function send(fn, args, problem, done) {
        busy = true; renderSave();
        var attempt = send.attempt = (send.attempt || 0) + 1;
        // If Google never answers, give up waiting; a later answer is still used if it comes.
        var giveUp = setTimeout(function () {
          if (attempt !== send.attempt || !busy) return;
          busy = false; confirmNoNumber = false; renderSave();
          problem('Not saved: no signal. Tap Save again.');
        }, SAVE_WAIT_MS);
        var run = google.script.run.withSuccessHandler(function (r) {
          clearTimeout(giveUp);
          busy = false; confirmNoNumber = false;
          if (!r || !r.ok) { renderSave(); return problem((r && r.message) || 'Something went wrong. Try again.'); }
          var keepK = k;
          data = r; data.k = keepK;
          done(r);
        }).withFailureHandler(function (error) {
          clearTimeout(giveUp);
          if (attempt !== send.attempt) return;
          busy = false; confirmNoNumber = false; renderSave();
          problem(readable(error));
        });
        run[fn].apply(run, args);
      }
      function renderSave() {
        var save = $('save');
        var asking = screen === 'form' && mode.kind === 'new' && confirmNoNumber && !form.phone.trim();
        save.textContent = busy ? 'Saving…' : (asking ? 'Save without a number?' : 'Save');
        save.className = 'big' + (asking && !busy ? ' warn' : '');
        save.disabled = busy;
      }
      function clearProblem() {
        $('formNote').hidden = true;
        $('u-problem').hidden = true;
        $('toast').style.display = 'none';
      }

      // ---- List ----
      function renderList() {
        $('who').textContent = data.rep;
        $('draftBanner').hidden = !hasDraft();
        $('noStorage').hidden = storageWorks;
        var box = $('sites');
        box.textContent = '';
        if (!data.sites.length) {
          box.appendChild(el('div', 'No sites yet. Tap + New Site to add your first one.', 'empty'));
          return;
        }
        data.sites.forEach(function (s) {
          var card = el('div', undefined, 'card');
          card.setAttribute('role', 'button');
          card.addEventListener('click', function () { showSite(s.id); });
          card.appendChild(el('div', s.name, 'name'));
          var meta = [s.area, s.buyerType].filter(Boolean).join(' · ');
          if (meta) card.appendChild(el('div', meta, 'meta'));
          if (s.value && has(rules().valueStages, s.stage)) card.appendChild(el('div', rs(s.value) + (s.terms ? ' · ' + s.terms : ''), 'value'));
          if (s.followUp) card.appendChild(el('div', 'Follow up: ' + shortDay(s.followUp), 'meta'));
          card.appendChild(el('span', s.stage, 'tag' + stageClass(s.stage)));
          if (!s.phone) card.appendChild(el('span', 'No number yet', 'tag nonum'));
          box.appendChild(card);
        });
      }
      function stageClass(stage) {
        if (stage === rules().lostStage) return ' lost';
        if (has(rules().closedStages, stage)) return ' won';
        return '';
      }

      // ---- Site screen: details and Update (spec 004) ----
      function emptyUpdate(s) {
        return { stage: s.stage, value: s.value ? String(s.value) : '', terms: s.terms, lostReason: s.lostReason,
          followUp: 'tomorrow', date: '', note: '', phone: '', saveId: newSaveId() };
      }
      function renderSiteHead(s) {
        var head = $('siteHead'); head.textContent = '';
        head.appendChild(el('h2', s.name));
        var meta = [s.area, s.buyerType].filter(Boolean).join(' · ');
        if (meta) head.appendChild(el('div', meta, 'line'));
        head.appendChild(el('div', [s.contactName, showPhone(s.phone)].filter(Boolean).join(' · ') || ' ', 'line'));
        if (!s.phone) head.appendChild(el('span', 'No number yet', 'tag nonum'));
        head.appendChild(el('span', s.stage, 'tag' + stageClass(s.stage)));
        if (s.value) head.appendChild(el('div', 'Last value: ' + rs(s.value) + (s.terms ? ' · ' + s.terms : ''), 'line'));
        if (s.lostReason && s.stage === rules().lostStage) head.appendChild(el('div', 'Lost: ' + s.lostReason, 'line'));
        if (s.followUp) head.appendChild(el('div', 'Follow up: ' + shortDay(s.followUp), 'line'));
        if (s.note) head.appendChild(el('div', '“' + s.note + '”', 'lastnote'));
      }
      function renderUpdate() {
        var s = siteById(openId);
        var r = rules();
        var stages = $('u-stage'); stages.textContent = '';
        r.stages.forEach(function (st) {
          stages.appendChild(pill(st, upd.stage === st, function () { upd.stage = st; updChanged(); }));
        });
        $('u-valueBox').hidden = !has(r.valueStages, upd.stage);
        $('u-value').value = upd.value;
        var terms = $('u-terms'); terms.textContent = '';
        r.paymentTerms.forEach(function (t) {
          terms.appendChild(pill(t, upd.terms === t, function () { upd.terms = t; updChanged(); }));
        });
        $('u-lostBox').hidden = upd.stage !== r.lostStage;
        var lost = $('u-lost'); lost.textContent = '';
        data.lostReasons.forEach(function (reason) {
          lost.appendChild(pill(reason, upd.lostReason === reason, function () { upd.lostReason = reason; updChanged(); }));
        });
        var needsNumber = has(r.numberStages, upd.stage) && !s.phone;
        $('u-phoneBox').hidden = !needsNumber;
        $('u-phoneLabel').textContent = "Add the contact's number to move this site to " + upd.stage;
        $('u-phone').value = upd.phone;
        $('u-followBox').hidden = has(r.closedStages, upd.stage);
        var follow = $('u-follow'); follow.textContent = '';
        FOLLOW.forEach(function (f) {
          follow.appendChild(pill(f[1], upd.followUp === f[0], function () { upd.followUp = f[0]; updChanged(); }));
        });
        $('u-date').hidden = upd.followUp !== 'date';
        $('u-date').min = data.today;
        $('u-date').max = addDays(data.today, 365);
        $('u-date').value = upd.date;
        $('u-note').value = upd.note;
        var noteNeeded = upd.stage === r.lostStage && /^other$/i.test(upd.lostReason || '');
        $('u-noteOpt').textContent = noteNeeded ? '(needed for Other)' : '(optional)';
        renderSave();
      }
      function updChanged() { clearProblem(); store(updKey(openId), upd); renderUpdate(); }
      function saveUpdate() {
        if (busy) return;
        var s = siteById(openId);
        var r = rules();
        var box = $('u-problem');
        function problem(text) { box.textContent = text; box.hidden = false; toast(text, true); }
        var digits = String(upd.value).replace(/^\s*rs\.?/i, '').replace(/[,\s]/g, '');
        if (has(r.valueStages, upd.stage)) {
          if (!/^\d+$/.test(digits) || Number(digits) < 1) return problem('Type the total Rs. value.');
          if (!upd.terms) return problem('Tap Cash or Credit.');
        }
        if (upd.stage === r.lostStage) {
          if (!upd.lostReason) return problem('Tap a lost reason.');
          if (/^other$/i.test(upd.lostReason) && !upd.note.trim()) return problem('Write a short note for Other.');
        }
        if (has(r.numberStages, upd.stage) && !s.phone && !upd.phone.trim()) {
          return problem("Add the contact's number to move this site to " + upd.stage + '.');
        }
        if (!has(r.closedStages, upd.stage) && upd.followUp === 'date' && !upd.date) return problem('Pick a follow-up date.');
        clearProblem();
        var input = {
          stage: upd.stage, value: upd.value, terms: upd.terms, lostReason: upd.lostReason,
          followUp: upd.followUp === 'date' ? upd.date : upd.followUp, note: upd.note, phone: upd.phone, saveId: upd.saveId,
        };
        var id = openId;
        send('repUpdateSite', [k, id, input], problem, function (reply) {
          store(updKey(id), null);
          showList(); savedToast(reply);
        });
      }
      function checkUpdPhone() {
        var typed = upd.phone.trim();
        var note = $('u-phoneNote');
        if (!typed) { note.hidden = true; return; }
        google.script.run.withSuccessHandler(function (r) { showPhoneNote(note, r, typed === upd.phone.trim()); })
          .withFailureHandler(function () { /* no signal: the save will check again */ }).repCheckPhone(k, typed);
      }
      function showPhoneNote(note, r, current) {
        if (!current) return; // he typed more meanwhile
        var lines = [];
        var cls = 'note warn';
        if (!r.valid) { lines.push('Check the number.'); cls = 'note error'; }
        if (r.team) lines.push('Someone in the team already works with this contact.');
        if (r.mine && r.mine.length) lines.push('You already have this number: ' + r.mine.join(', ') + '.');
        note.textContent = lines.join(' ');
        note.className = cls;
        note.hidden = !lines.length;
      }

      // ---- Details form: + New Site and Edit details ----
      function renderForm() {
        $('formTitle').textContent = mode.kind === 'edit' ? 'Edit details' : 'New site';
        $('f-name').value = form.name;
        $('f-contact').value = form.contactName;
        $('f-phone').value = form.phone;
        $('f-newarea').value = form.newArea;

        var buyer = $('f-buyer'); buyer.textContent = '';
        data.buyerTypes.forEach(function (t) {
          buyer.appendChild(pill(t, form.buyerType === t, function () { form.buyerType = t; changed(); }));
        });
        var products = $('f-products'); products.textContent = '';
        data.categories.forEach(function (c) {
          var on = form.products.indexOf(c) >= 0;
          products.appendChild(pill(c, on, function () {
            form.products = on ? form.products.filter(function (p) { return p !== c; }) : form.products.concat([c]);
            changed();
          }));
        });
        var areas = $('f-areas'); areas.textContent = '';
        var areaList = data.areas.slice();
        if (form.area && !form.addingArea && !has(areaList, form.area)) areaList.push(form.area); // his site's area
        areaList.forEach(function (a) {
          areas.appendChild(pill(a, !form.addingArea && form.area === a, function () {
            form.area = form.area === a && !form.addingArea ? '' : a; form.addingArea = false; changed();
          }));
        });
        areas.appendChild(pill('+ New area', form.addingArea, function () {
          form.addingArea = !form.addingArea; changed();
          if (form.addingArea) $('f-newarea').focus();
        }));
        $('newAreaBox').hidden = !form.addingArea;
        renderSuggestions();

        $('f-followBox').hidden = mode.kind === 'edit';
        var follow = $('f-follow'); follow.textContent = '';
        FOLLOW.forEach(function (f) {
          follow.appendChild(pill(f[1], form.followUp === f[0], function () { form.followUp = f[0]; changed(); }));
        });
        $('f-date').hidden = form.followUp !== 'date';
        $('f-date').min = data.today;
        $('f-date').max = addDays(data.today, 365);
        $('f-date').value = form.date;
        renderSave();
      }
      function changed() {
        confirmNoNumber = false;
        clearProblem();
        saveDraft();
        renderForm();
      }

      // "Did you mean": the same rules as the server (src/siterules.js areaMatches_).
      function areaKey(s) { return String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }
      function distance(a, b) {
        var prev = []; for (var j = 0; j <= b.length; j++) prev[j] = j;
        for (var i = 1; i <= a.length; i++) {
          var cur = [i];
          for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          prev = cur;
        }
        return prev[b.length];
      }
      function closeAreas(typed) {
        var key = areaKey(typed);
        if (key.length < 3) return [];
        for (var i = 0; i < data.areas.length; i++) if (areaKey(data.areas[i]) === key) return [data.areas[i]];
        return data.areas.map(function (name) {
          var other = areaKey(name);
          var prefix = other.length >= 3 && (other.indexOf(key) === 0 || key.indexOf(other) === 0);
          return { name: name, d: prefix ? 0 : distance(key, other) };
        }).filter(function (m) { return m.d <= 2; })
          .sort(function (x, y) { return x.d - y.d || x.name.localeCompare(y.name); })
          .slice(0, 3).map(function (m) { return m.name; });
      }
      function renderSuggestions() {
        var box = $('areaSuggest'); box.textContent = '';
        if (!form.addingArea) return;
        closeAreas(form.newArea).forEach(function (name) {
          box.appendChild(pill('Did you mean ' + name + '?', false, function () {
            form.area = name; form.addingArea = false; form.newArea = ''; changed();
          }));
        });
      }

      // ---- Phone check (duplicate warning, ADR-0004) ----
      function checkPhone() {
        var typed = form.phone.trim();
        var note = $('phoneNote');
        if (!typed) { phoneCheck = { valid: true }; note.hidden = true; return; }
        google.script.run.withSuccessHandler(function (r) {
          if (form.phone.trim() !== typed) return;
          phoneCheck = r;
          showPhoneNote(note, r, true);
        }).withFailureHandler(function () { /* no signal: the save will check again */ })
          .repCheckPhone(k, typed);
      }

      function saveForm() {
        if (busy) return;
        var note = $('formNote');
        // Shown under the form and as a pop-up just above Save, which he may be looking at.
        function problem(text) { note.textContent = text; note.hidden = false; toast(text, true); }
        if (!form.name.trim()) return problem('Type the site name.');
        if (!form.buyerType) return problem('Tap a buyer type.');
        if (phoneCheck.valid === false && form.phone.trim()) return problem('Check the number.');
        if (mode.kind === 'edit') {
          var site = siteById(mode.siteId);
          if (site && site.phone && !form.phone.trim()) return problem("A site's number can be changed, not removed.");
        } else {
          if (form.followUp === 'date' && !form.date) return problem('Pick a follow-up date.');
          if (!form.phone.trim() && !confirmNoNumber) { confirmNoNumber = true; clearProblem(); renderSave(); return; }
        }
        if (!form.saveId) { form.saveId = newSaveId(); saveDraft(); }
        note.hidden = true;
        var input = {
          name: form.name, buyerType: form.buyerType, contactName: form.contactName, phone: form.phone,
          products: form.products, area: form.addingArea ? form.newArea : form.area, saveId: form.saveId,
        };
        var key = formKey();
        if (mode.kind === 'edit') {
          var id = mode.siteId;
          send('repEditSite', [k, id, input], problem, function (reply) {
            store(key, null); phoneCheck = { valid: true };
            showSite(id); savedToast(reply);
          });
        } else {
          input.followUp = form.followUp === 'date' ? form.date : form.followUp;
          send('repAddSite', [k, input], problem, function (reply) {
            form = emptyForm(); store(key, null); phoneCheck = { valid: true };
            showList(); savedToast(reply);
          });
        }
      }

      // ---- Screens ----
      function showOnly(name) {
        screen = name;
        $('listView').hidden = name !== 'list';
        $('siteView').hidden = name !== 'site';
        $('formView').hidden = name !== 'form';
        $('formActions').hidden = name === 'list';
        $('newSite').hidden = name !== 'list';
        clearProblem();
        window.scrollTo(0, 0);
      }
      function showList() { showOnly('list'); renderList(); }
      function showSite(id) {
        var s = siteById(id);
        if (!s) return showList();
        openId = id;
        var draft = fetchStored(updKey(id));
        upd = draft ? Object.assign(emptyUpdate(s), draft) : emptyUpdate(s);
        if (!upd.saveId) upd.saveId = newSaveId();
        $('u-phoneNote').hidden = true;
        showOnly('site');
        renderSiteHead(s);
        renderUpdate();
      }
      function showForm(editId) {
        mode = editId ? { kind: 'edit', siteId: editId } : { kind: 'new' };
        var draft = fetchStored(formKey());
        if (draft) {
          form = Object.assign(emptyForm(), draft);
        } else if (editId) {
          var s = siteById(editId);
          form = Object.assign(emptyForm(), { name: s.name, buyerType: s.buyerType, contactName: s.contactName,
            phone: showPhone(s.phone), products: s.products.slice(), area: s.area });
        } else {
          form = emptyForm();
        }
        if (!form.saveId) form.saveId = newSaveId();
        confirmNoNumber = false; phoneCheck = { valid: true };
        $('phoneNote').hidden = true;
        showOnly('form');
        renderForm();
        if (form.phone && !editId) checkPhone();
      }

      $('newSite').addEventListener('click', function () { showForm(''); });
      $('editDetails').addEventListener('click', function () { showForm(openId); });
      $('cancel').addEventListener('click', function () {
        if (screen === 'form' && mode.kind === 'edit') showSite(mode.siteId); else showList();
      });
      $('save').addEventListener('click', function () { if (screen === 'site') saveUpdate(); else saveForm(); });

      $('f-name').addEventListener('input', function (e) { form.name = e.target.value; confirmNoNumber = false; clearProblem(); saveDraft(); renderSave(); });
      $('f-contact').addEventListener('input', function (e) { form.contactName = e.target.value; clearProblem(); saveDraft(); });
      $('f-phone').addEventListener('input', function (e) {
        form.phone = e.target.value; confirmNoNumber = false; phoneCheck = { valid: true };
        $('phoneNote').hidden = true; clearProblem(); saveDraft(); renderSave();
        // Check once he pauses, when it could be a whole number (10+ digits).
        clearTimeout(checkPhone.timer);
        if (form.phone.replace(/\D/g, '').length >= 10) checkPhone.timer = setTimeout(checkPhone, 700);
      });
      $('f-phone').addEventListener('change', checkPhone);
      $('f-newarea').addEventListener('input', function (e) { form.newArea = e.target.value; saveDraft(); renderSuggestions(); });
      $('f-date').addEventListener('change', function (e) { form.date = e.target.value; saveDraft(); });

      $('u-value').addEventListener('input', function (e) { upd.value = e.target.value; clearProblem(); store(updKey(openId), upd); });
      $('u-note').addEventListener('input', function (e) { upd.note = e.target.value; clearProblem(); store(updKey(openId), upd); });
      $('u-date').addEventListener('change', function (e) { upd.date = e.target.value; store(updKey(openId), upd); });
      $('u-phone').addEventListener('input', function (e) {
        upd.phone = e.target.value; clearProblem(); store(updKey(openId), upd);
        $('u-phoneNote').hidden = true;
        clearTimeout(checkUpdPhone.timer);
        if (upd.phone.replace(/\D/g, '').length >= 10) checkUpdPhone.timer = setTimeout(checkUpdPhone, 700);
      });

      showList();
    </script>
  </body>
</html>
